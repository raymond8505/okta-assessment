# node-modules (not PnP) is required twice over:
#   1. Turbopack does not support Yarn PnP.
#   2. The Dockerfile's `COPY --from=deps /app/node_modules` needs a real directory.
nodeLinker: node-modules

enableScripts: true

# Supply-chain cooldown: refuse any version published in the last 7 days
# (10080 minutes — Yarn wants numeric minutes; duration strings like "7d" were
# silently ignored in early 4.10/4.11). Committed here, not in home config, so
# CI and every machine enforce it identically. Requires Yarn 4.10+; the
# packageManager pin above guarantees a release that honours it.
npmMinimalAgeGate: 10080
